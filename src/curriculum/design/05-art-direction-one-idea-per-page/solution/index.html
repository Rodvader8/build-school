<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harbourline: art direction</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero">
    <p class="eyebrow">Harbourline Studio</p>

    <div class="actions">
      <a class="btn btn--book" href="#">Book a call</a>
      <a class="btn btn--work" href="#">See our work</a>
      <a class="btn btn--guide" href="#">Get the guide</a>
    </div>
    <ul class="proof">
      <li class="stat"><span class="stat-number">98</span> average performance score</li>
      <li class="stat"><span class="stat-number">0.8s</span> typical load time</li>
      <li class="stat"><span class="stat-number">100%</span> of sites measured</li>
