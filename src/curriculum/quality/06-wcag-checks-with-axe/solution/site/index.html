<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Get a quote | Blue Gum Landscaping</title>
    <meta name="description" content="Ask for a quote on garden design and maintenance in Melbourne's northern suburbs." />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header>
      <nav aria-label="Main">
        <a href="/">Home</a>
        <a href="/services">Services</a>
        <a href="/contact" aria-current="page">Contact</a>
      </nav>
      <a class="social" href="https://instagram.example/bluegum" aria-label="Blue Gum Landscaping on Instagram">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2" /><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" /></svg>
      </a>
    </header>
    <main id="main">
      <h1>Get a garden quote</h1>
      <p class="intro">Tell us a little about your garden and we'll visit within the week.</p>
      <img src="/garden.svg" width="800" height="400" alt="A native garden with a curved stone path" />
      <h2>Tell us about your garden</h2>
      <form>
        <label for="name">Your name</label>
        <input id="name" name="name" autocomplete="name" />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" />
        <label for="message">What would you like done?</label>
        <textarea id="message" name="message" rows="4"></textarea>
        <button type="submit">Send enquiry</button>
      </form>
      <button class="close" type="button" aria-label="Close notice">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" /></svg>
      </button>
    </main>
    <footer>
      <p class="muted">Blue Gum Landscaping, Northcote VIC</p>
    </footer>
  </body>
</html>
