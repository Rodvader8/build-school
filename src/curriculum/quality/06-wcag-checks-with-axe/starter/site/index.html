<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Get a quote | Blue Gum Landscaping</title>
    <meta name="description" content="Ask for a quote on garden design and maintenance in Melbourne's northern suburbs." />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="top">
      <div class="nav">
        <a href="/">Home</a>
        <a href="/services">Services</a>
        <a href="/contact">Contact</a>
      </div>
      <a class="social" href="https://instagram.example/bluegum">
        <svg width="24" height="24" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2" /><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" /></svg>
      </a>
    </div>
    <div class="content">
      <h1>Get a garden quote</h1>
      <p class="intro muted">Tell us a little about your garden and we'll visit within the week.</p>
      <img src="/garden.svg" width="800" height="400" />
      <h3>Tell us about your garden</h3>
      <form>
        <input name="name" placeholder="Your name" />
        <input name="email" type="email" placeholder="Email" tabindex="3" />
        <textarea name="message" rows="4" placeholder="What would you like done?"></textarea>
        <button type="submit">Send enquiry</button>
      </form>
      <button class="close" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" /></svg>
      </button>
    </div>
    <div class="foot">
      <p class="muted">Blue Gum Landscaping, Northcote VIC</p>
    </div>
  </body>
</html>
