<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stagger | Ellis Ward</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="gs-page">
      <p class="gs-kicker">Ellis Ward Architects</p>
      <h1>One tween, many elements</h1>
      <p class="gs-note">A stagger turns one tween into a wave: each target starts a beat after the last.</p>
      <div class="gs-tiles">
        <div class="gs-tile">Kitchens</div>
        <div class="gs-tile">Bathrooms</div>
        <div class="gs-tile">Extensions</div>
        <div class="gs-tile">Decks</div>
        <div class="gs-tile">Heritage</div>
        <div class="gs-tile">Coastal</div>
        <div class="gs-tile">Pools</div>
        <div class="gs-tile">Studios</div>
      </div>
      <div class="gs-dots">
        <span class="gs-dot"></span>
        <span class="gs-dot"></span>
        <span class="gs-dot"></span>
        <span class="gs-dot"></span>
        <span class="gs-dot"></span>
        <span class="gs-dot"></span>
        <span class="gs-dot"></span>
        <span class="gs-dot"></span>
        <span class="gs-dot"></span>
        <span class="gs-dot"></span>
        <span class="gs-dot"></span>
        <span class="gs-dot"></span>
      </div>
    </main>

    <script src="/vendor/gsap/gsap.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
