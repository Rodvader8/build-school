<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Components without repeating</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="min-h-screen bg-ink text-cream">
    <main class="mx-auto max-w-4xl px-6 py-16">
      <h1 class="text-4xl font-semibold">Entities</h1>
      <section id="cards" class="mt-8 grid gap-4 sm:grid-cols-2">
        <article class="flex flex-col gap-1 rounded-2xl border border-line bg-surface p-5">
          <p class="text-xs font-medium uppercase tracking-widest text-accent">Trust</p>
          <h2 class="text-lg font-semibold">Family Trust</h2>
          <p class="text-2xl text-cream">$2,400,000</p>
        </article>
        <article class="flex flex-col gap-1 rounded-2xl border border-line bg-surface p-5">
          <p class="text-xs font-medium uppercase tracking-widest text-accent">SMSF</p>
          <h2 class="text-lg font-semibold">Rowan Super Fund</h2>
          <p class="text-2xl text-cream">$1,850,000</p>
        </article>
        <article class="flex flex-col gap-1 rounded-2xl border border-line bg-surface p-5">
          <p class="text-xs font-medium uppercase tracking-widest text-accent">Company</p>
          <h2 class="text-lg font-semibold">Harbour Holdings</h2>
          <p class="text-2xl text-cream">$3,100,000</p>
        </article>
        <article class="flex flex-col gap-1 rounded-2xl border border-line bg-surface p-5">
          <p class="text-xs font-medium uppercase tracking-widest text-accent">Personal</p>
          <h2 class="text-lg font-semibold">Joint Account</h2>
          <p class="text-2xl text-cream">$420,000</p>
        </article>
        <article class="flex flex-col gap-1 rounded-2xl border border-line bg-surface p-5">
          <p class="text-xs font-medium uppercase tracking-widest text-accent">Trust</p>
          <h2 class="text-lg font-semibold">Education Trust</h2>
          <p class="text-2xl text-cream">$310,000</p>
        </article>
      </section>
      <div class="mt-10 flex gap-3">
        <a href="#add" class="btn">Add an entity</a>
        <a href="#export" class="btn">Export a report</a>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
