<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design tokens with @theme</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="min-h-screen bg-ink font-sans text-cream">
    <main class="mx-auto flex max-w-2xl flex-col gap-6 px-6 py-20">
      <p class="text-sm font-medium uppercase tracking-widest text-accent">Quarterly review</p>
      <h1 class="font-display text-5xl leading-tight">Numbers that stay put</h1>
      <p class="text-lg text-muted">Every colour and font on this page comes from a theme variable, so changing a token restyles the whole site at once.</p>
      <section class="rounded-2xl border border-line bg-surface p-6">
        <h2 class="font-display text-2xl">Net worth</h2>
        <p class="mt-2 text-4xl font-semibold">$8,080,000</p>
        <a href="#breakdown" class="mt-6 inline-block rounded-full bg-accent px-5 py-2 text-sm font-semibold text-ink">View breakdown</a>
      </section>
    </main>
  </body>
</html>
