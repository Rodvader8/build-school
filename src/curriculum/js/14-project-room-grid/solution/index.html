<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Availability | Brightwater House</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="db-page">
      <h1>Room availability</h1>
      <p class="db-note">The next 14 nights. Click free nights to build a booking.</p>
      <section class="db-panel">
        <div class="tw-grid" aria-label="Rooms by night"></div>
      </section>
      <section class="db-panel db-row" aria-live="polite">
        <p><span class="db-figure tw-nights">0</span> nights selected</p>
        <p>Total <span class="db-figure tw-total">$0</span></p>
      </section>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
