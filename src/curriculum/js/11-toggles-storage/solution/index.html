<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Net worth | Larkfield portal</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="db-page">
      <h1>Net worth</h1>
      <div class="db-row" role="group" aria-label="Period">
        <button class="db-button" type="button" data-period="1Y" aria-pressed="false">1Y</button>
        <button class="db-button" type="button" data-period="5Y" aria-pressed="false">5Y</button>
        <button class="db-button" type="button" data-period="10Y" aria-pressed="false">10Y</button>
      </div>
      <section class="db-panel">
        <p class="db-figure">$0</p>
        <p class="db-note db-change"></p>
      </section>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
