name: CI

# Every push and every pull request runs the same steps you run on your own machine.
on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the run it replaces, so the queue never backs up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the code. Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
