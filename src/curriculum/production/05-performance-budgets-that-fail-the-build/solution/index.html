<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tideline | Tide times for the coast</title>
    <meta name="description" content="Tideline shows today's tide times for the coast at a glance, with a full chart one tap away." />
  </head>
  <body>
    <header class="top"><h1>Tideline</h1></header>
    <main class="page">
      <img class="hero" src="/hero.jpg" width="1200" height="630" alt="Warm amber light spreading over a dark sea at dusk" />
      <p class="lede">High tide at 6:42 am and 7:05 pm. Low tide at 12:51 pm.</p>
      <button id="show" class="button" type="button">Show the full tide chart</button>
      <p id="chart" class="chart" hidden></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
