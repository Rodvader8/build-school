<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Canvas 2D drawing | Sunrise</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="cv-page">
      <p class="cv-kicker">Canvas 2D</p>
      <h1>A sunrise, drawn with code</h1>
      <canvas class="cv-scene" aria-label="A sun rising over a headland and the sea" role="img"></canvas>
      <label class="cv-slider-row">
        <span class="cv-note">Sunrise</span>
        <input class="cv-slider" type="range" min="0" max="100" value="0">
      </label>
    </main>

    <script src="script.js"></script>
  </body>
</html>
